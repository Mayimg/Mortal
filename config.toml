[control]
version = 4
state_file = 'models/test_mortal61.pth'
best_state_file = 'models/test_best61.pth'
tensorboard_dir = 'logs/tensorboard_test61'
steps = 300000
batch_size = 2048
opt_step_every = 4
save_every = 100
test_every = 4000
submit_every = 400
print_every = 100
device = 'cuda:0'
enable_amp = true
enable_cudnn_benchmark = true
enable_compile = false
print_states = true
online = true
algo = 'ach'

[ach]
eta = 1              # Hedge 係数
logit_threshold = 6.0  # ロジットしきい値（±値でクリップ）
ratio_clip = 0.5       # PPO の比率クリップ ε
adv_clip = 5.0         # アドバンテージのミニバッチ正規化後クリップ幅
gae_lambda = 0.95      # 便宜上保持（実質 MC）
entropy_coef = 2e-2    # エントロピー係数 β
value_coef = 0.5       # 価値損失の係数 α
batch_size = 2048

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'models/test_best15.pth'  # ベースライン（対戦相手）モデル

[train_play.default]
games = 50
log_dir = 'logs/train_play'
boltzmann_epsilon = 1.0
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[online]
history_window = 50 
enable_compile = false 

[online.remote]
host = '127.0.0.1'  # サーバーのホスト
port = 5000  # サーバーのポート

[online.server]
buffer_dir = 'online_training_data/buffer'  
drain_dir = 'online_training_data/drain'  
capacity = 50
force_sequential = false  
sample_reuse_rate = 0  
sample_reuse_threshold = 0  

[dataset]
globs = ['data/training/**/*.json.gz']
enable_augmentation = true
file_batch_size = 50
num_workers = 4
file_index = 'cache/main_file_index.pth'
reserve_ratio = 0.5
sample_ratio = 1.0  # 0.0-1.0: 局面のサンプリング割合（ACHローダ用）
num_epochs = 1
augmented_first = false
player_names_files = []

[env]
gamma = 1.0
# pts = [6.0, 4.0, 2.0, 0.0]
pts = [3.0, 1.0, -1.0, -3.0]


[resnet]
conv_channels = 192
num_blocks = 40
use_checkpoint = true  # 活性化チェックポイントを有効化
checkpoint_segments = 10  # 40ブロックを8セグメントに分割（各5ブロック）

[cql]
target_update_interval = 1000
min_q_weight = 5.0
num_samples = 10

[dqn]
hidden_size = 1024

[aux]
hidden_size = 1024
next_rank_weight = 0.2

[test_play]
games = 1000
log_dir = 'logs/test_play'

[freeze_bn]
mortal = false

[optim]
# lr = 0.00001
lr = 0.00001
weight_decay = 0.00001
lr_scheduler = 'constant'
eps = 1e-8
betas = [0.9, 0.999]
max_grad_norm = 1.0

[optim.scheduler]
# peak = 0.00001
# final = 0.00001
# peak = 0.000001
# final = 0.000001
peak = 0.00025
final = 0.00025
warm_up_steps = 0
max_steps = 1000000

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'models/test_best23_2.pth'

[1v3]
seed_key = -1  # -1 for random seed
games_per_iter = 20000
iters = 1
log_dir = 'logs/1v3_battles_25_vs_23'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal_best'
state_file = 'models/test_best25.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'mortal_baseline'
state_file = 'models/test_best23_2.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false

[grp]
state_file = 'models/grp.pth'

[grp.control]
device = 'cuda:0'
batch_size = 512
save_every = 2000
print_every = 10
val_interval = 100
val_steps = 400
enable_cudnn_benchmark = true
tensorboard_dir = 'logs/tensorboard_grp'

[grp.dataset]
train_globs = ['data/training/**/*.json.gz']
# Note: validation directory doesn't exist yet. You'll need to create it and add validation data.
# For now, pointing to a non-existent directory. Update this path when validation data is available.
val_globs = ['data/validation/**/*.json.gz']
enable_augmentation = true
file_batch_size = 50
file_index = 'cache/grp_file_index.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.optim]
lr = 0.002
weight_decay = 0.00001
